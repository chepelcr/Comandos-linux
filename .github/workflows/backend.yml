name: Test and update progress API
on:
  push:
    branches: [main]
    paths: ['backend/service/**', 'src/data/lessons.json', 'src/data/rewards.json', 'src/data/courses.json', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: backend-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci --prefix backend/service
      - run: npm test
      - run: npm run check --prefix backend/service
      - run: npm run backend:bundle
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy immutable code artifact
        env:
          ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
          FUNCTION_NAME: ${{ vars.AWS_PROGRESS_FUNCTION }}
          LAB_FUNCTION_NAME: ${{ vars.AWS_LAB_FUNCTION }}
        run: |
          artifact_key="progress/$(sha256sum backend/service/lambda-package.zip | cut -d ' ' -f 1).zip"
          aws s3 cp backend/service/lambda-package.zip "s3://$ARTIFACT_BUCKET/$artifact_key"
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --s3-bucket "$ARTIFACT_BUCKET" --s3-key "$artifact_key" --publish
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          if test -n "$LAB_FUNCTION_NAME"; then
            aws lambda update-function-code --function-name "$LAB_FUNCTION_NAME" --s3-bucket "$ARTIFACT_BUCKET" --s3-key "$artifact_key" --publish
            aws lambda wait function-updated --function-name "$LAB_FUNCTION_NAME"
          fi

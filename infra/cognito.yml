AWSTemplateFormatVersion: '2010-09-09'
Description: Linux Lab accounts with public PKCE client and email verification
Parameters:
  AppUrl:
    Type: String
    Default: https://linux.jcampos.dev/
  DomainPrefix:
    Type: String
    Default: linux-lab-947999370977
  CognitoTemplatesLambdaArn:
    Type: String
    Default: ''
  SesFromArn:
    Type: String
    Default: ''
Conditions:
  HasTemplates: !Not [!Equals [!Ref CognitoTemplatesLambdaArn, '']]
  HasSes: !Not [!Equals [!Ref SesFromArn, '']]
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LambdaConfig: !If [HasTemplates, {CustomMessage: !Ref CognitoTemplatesLambdaArn}, !Ref AWS::NoValue]
      EmailConfiguration: !If [HasSes, {EmailSendingAccount: DEVELOPER, SourceArn: !Ref SesFromArn, From: 'Linux Lab <linux-lab@jcampos.dev>'}, {EmailSendingAccount: COGNITO_DEFAULT}]
      UserPoolName: linux-lab-students
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      UserPoolTier: ESSENTIALS
  Client:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: linux-lab-browser
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile, aws.cognito.signin.user.admin]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Ref AppUrl, 'http://localhost:5173/', 'http://127.0.0.1:5173/']
      LogoutURLs: [!Ref AppUrl, 'http://localhost:5173/', 'http://127.0.0.1:5173/']
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix
      ManagedLoginVersion: 2
  Branding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref Client
      UseCognitoProvidedValues: true
Outputs:
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref Client
  Domain:
    Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  Issuer:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}

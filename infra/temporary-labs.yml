AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated temporary EC2 course labs, one account lock in S3, server-enforced expiry
Parameters:
  ApiId: {Type: String}
  AuthorizerId: {Type: String}
  ArtifactBucket: {Type: String}
  ArtifactKey: {Type: String}
  LabImageId:
    Type: AWS::EC2::Image::Id
    Description: Verified preloaded Debian amd64 AMI with SSM agent and offline exercise dependencies
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.246.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: linux-course-isolated}]
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.246.0.0/26
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable}
  # Deliberately no InternetGateway, NAT, peering, transit gateway or public routes.
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private SSM endpoints; no outbound application traffic
      VpcId: !Ref Vpc
      SecurityGroupEgress: [{IpProtocol: tcp, FromPort: 1, ToPort: 1, CidrIp: 127.0.0.1/32}]
  LabSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No ingress; egress only HTTPS to the two private SSM endpoints
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationSecurityGroupId: !Ref EndpointSecurityGroup}
  EndpointIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref EndpointSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref LabSecurityGroup}
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: AgentChannelsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:UpdateInstanceInformation, ssmmessages:CreateControlChannel, ssmmessages:CreateDataChannel, ssmmessages:OpenControlChannel, ssmmessages:OpenDataChannel]
                Resource: '*'
                Condition: {StringEquals: {aws:SourceVpc: !Ref Vpc}}
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref InstanceRole]}
  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      PrivateDnsEnabled: true
      SubnetIds: [!Ref Subnet]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: ssm:UpdateInstanceInformation
            Resource: '*'
            Condition: {ArnEquals: {aws:PrincipalArn: !GetAtt InstanceRole.Arn}}
  MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssmmessages
      PrivateDnsEnabled: true
      SubnetIds: [!Ref Subnet]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: [ssmmessages:CreateControlChannel, ssmmessages:CreateDataChannel, ssmmessages:OpenControlChannel, ssmmessages:OpenDataChannel]
            Resource: '*'
            Condition: {ArnEquals: {aws:PrincipalArn: !GetAtt InstanceRole.Arn}}
  SessionDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Session
      Content:
        schemaVersion: '1.0'
        description: Course shell; idle 30 minutes, maximum 90 minutes
        sessionType: Standard_Stream
        inputs:
          idleSessionTimeout: '30'
          maxSessionDuration: '90'
          runAsEnabled: true
          runAsDefaultUser: student
          shellProfile: {linux: 'cd /home/student; exec /bin/bash -l'}
  CheckDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      Content:
        schemaVersion: '2.2'
        description: Validate observable course exercise state
        parameters:
          lesson:
            type: String
            allowedPattern: '^[a-z0-9_-]{1,64}$'
        mainSteps:
          - action: aws:runShellScript
            name: CheckExercise
            inputs:
              timeoutSeconds: '25'
              runCommand: ["/usr/local/bin/course-check '{{lesson}}'"]
  SessionsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
  SessionsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SessionsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Deny, Principal: '*', Action: 's3:*', Resource: [!GetAtt SessionsBucket.Arn, !Sub '${SessionsBucket.Arn}/*'], Condition: {Bool: {aws:SecureTransport: false}}}
  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
  DeadlineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnEquals: {aws:SourceArn: !GetAtt ScheduleGroup.Arn}
      Policies:
        - PolicyName: TerminateOnlyCourseInstances
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition: {StringEquals: {ec2:ResourceTag/Application: linux-course-lab}}
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: OwnTemporaryLabs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [s3:GetObject, s3:PutObject, s3:PutObjectTagging], Resource: [!Sub '${SessionsBucket.Arn}/sessions/*', !Sub '${SessionsBucket.Arn}/fleet/*']}
              - {Effect: Allow, Action: s3:ListBucket, Resource: !GetAtt SessionsBucket.Arn}
              - Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}::image/${LabImageId}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${Subnet}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${LabSecurityGroup}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
              - Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals: {aws:RequestTag/Application: linux-course-lab, ec2:InstanceType: t3.small}
              - Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                Condition:
                  Bool: {ec2:AssociatePublicIpAddress: false}
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: [!Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*', !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*']
                Condition: {StringEquals: {ec2:CreateAction: RunInstances}}
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition: {StringEquals: {ec2:ResourceTag/Application: linux-course-lab}}
              - {Effect: Allow, Action: ec2:DescribeInstances, Resource: '*'}
              - {Effect: Allow, Action: iam:PassRole, Resource: !GetAtt InstanceRole.Arn, Condition: {StringEquals: {iam:PassedToService: ec2.amazonaws.com}}}
              - {Effect: Allow, Action: iam:PassRole, Resource: !GetAtt DeadlineRole.Arn, Condition: {StringEquals: {iam:PassedToService: scheduler.amazonaws.com}}}
              - {Effect: Allow, Action: [scheduler:CreateSchedule, scheduler:DeleteSchedule], Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ScheduleGroup}/*'}
              - Effect: Allow
                Action: ssm:StartSession
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition: {StringEquals: {ssm:resourceTag/Application: linux-course-lab}}
              - {Effect: Allow, Action: ssm:StartSession, Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${SessionDocument}'}
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition: {StringEquals: {ssm:resourceTag/Application: linux-course-lab}}
              - {Effect: Allow, Action: ssm:SendCommand, Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${CheckDocument}'}
              - {Effect: Allow, Action: ssm:GetCommandInvocation, Resource: '*'}
              - {Effect: Allow, Action: ssm:DescribeSessions, Resource: '*'}
              - {Effect: Allow, Action: ssm:TerminateSession, Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:session/*'}
  Function:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: lab-lambda.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt ApiRole.Arn
      Environment:
        Variables:
          LAB_BUCKET: !Ref SessionsBucket
          LAB_AMI: !Ref LabImageId
          LAB_SUBNET: !Ref Subnet
          LAB_SECURITY_GROUP: !Ref LabSecurityGroup
          LAB_INSTANCE_PROFILE: !Ref InstanceProfile
          LAB_SESSION_DOCUMENT: !Ref SessionDocument
          LAB_CHECK_DOCUMENT: !Ref CheckDocument
          LAB_SCHEDULE_GROUP: !Ref ScheduleGroup
          LAB_DEADLINE_ROLE: !GetAtt DeadlineRole.Arn
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey}
  Logs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/${Function}', RetentionInDays: 14}
  Cleanup:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets: [{Arn: !GetAtt Function.Arn, Id: TerminateExpiredLabs, RetryPolicy: {MaximumEventAgeInSeconds: 300, MaximumRetryAttempts: 5}}]
  CleanupPermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !Ref Function, Action: 'lambda:InvokeFunction', Principal: events.amazonaws.com, SourceArn: !GetAtt Cleanup.Arn}
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties: {ApiId: !Ref ApiId, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt Function.Arn, PayloadFormatVersion: '2.0', TimeoutInMillis: 30000}
  RootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: ANY /labs
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [aws.cognito.signin.user.admin]
      Target: !Sub integrations/${Integration}
  ChildRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: ANY /labs/{proxy+}
      AuthorizationType: JWT
      AuthorizerId: !Ref AuthorizerId
      AuthorizationScopes: [aws.cognito.signin.user.admin]
      Target: !Sub integrations/${Integration}
  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !Ref Function, Action: 'lambda:InvokeFunction', Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/labs*'}
Outputs:
  FunctionName: {Value: !Ref Function}
  VpcId: {Value: !Ref Vpc}
  SubnetId: {Value: !Ref Subnet}
  SecurityGroupId: {Value: !Ref LabSecurityGroup}
  SessionsBucketName: {Value: !Ref SessionsBucket}

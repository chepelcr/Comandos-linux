AWSTemplateFormatVersion: '2010-09-09'
Description: Narrow GitHub role for updating the existing course Lambda code
Parameters:
  FunctionArn:
    Type: String
  LabFunctionArn:
    Type: String
    Default: ''
  ArtifactBucket:
    Type: String
  OidcProviderArn:
    Type: String
Conditions:
  HasLabFunction: !Not [!Equals [!Ref LabFunctionArn, '']]
Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: linux-lab-backend-code
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref OidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:chepelcr/Comandos-linux:environment:backend-production
      Policies:
        - PolicyName: UpdateCourseCodeOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:UpdateFunctionCode, lambda:GetFunctionConfiguration]
                Resource: [!Ref FunctionArn, !If [HasLabFunction, !Ref LabFunctionArn, !Ref 'AWS::NoValue']]
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/progress/*
Outputs:
  RoleArn:
    Value: !GetAtt Role.Arn

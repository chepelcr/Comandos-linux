AWSTemplateFormatVersion: '2010-09-09'
Description: Authenticated Linux Lab progression API
Parameters:
  UserPoolId:
    Type: String
  ClientId:
    Type: String
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  AppOrigin:
    Type: String
    Default: https://linux.jcampos.dev
Resources:
  ProgressBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
  ProgressBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProgressBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt ProgressBucket.Arn, !Sub '${ProgressBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: false}
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: OwnProgressObjects
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${ProgressBucket.Arn}/progress/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ProgressBucket.Arn
  ProgressFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: lambda.handler
      Timeout: 15
      MemorySize: 256
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          PROGRESS_BUCKET: !Ref ProgressBucket
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProgressFunction}
      RetentionInDays: 30
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: linux-lab-progress
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AppOrigin, 'http://localhost:5173', 'http://127.0.0.1:5173']
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600
  Authorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      Name: Cognito
      JwtConfiguration:
        Audience: [!Ref ClientId]
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ProgressFunction.Arn
      PayloadFormatVersion: '2.0'
  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: ANY /me
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      AuthorizationScopes: [aws.cognito.signin.user.admin]
      Target: !Sub integrations/${Integration}
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProgressFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/me
Outputs:
  ApiUrl:
    Value: !GetAtt Api.ApiEndpoint
  ProgressBucketName:
    Value: !Ref ProgressBucket
